name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            toxenv: flake8
            os: ubuntu-latest
          - python: "3.14"
            toxenv: mypy
            os: ubuntu-latest
          - python: "3.14"
            toxenv: pylint
            os: ubuntu-latest
          - python: "3.14"
            toxenv: black
            os: ubuntu-latest

          - python: "3.10"
            toxenv: py310
            os: ubuntu-latest
          - python: "3.11"
            toxenv: py311
            os: ubuntu-latest
          - python: "3.12"
            toxenv: py312
            os: ubuntu-latest
          - python: "3.13"
            toxenv: py313
            os: ubuntu-latest
          - python: "3.14"
            toxenv: py314
            os: ubuntu-latest
          - python: "3.15"
            toxenv: py315
            os: ubuntu-latest

          - python: "pypy-3.10"
            toxenv: pypy310
            os: ubuntu-latest
          - python: "pypy-3.11"
            toxenv: pypy311
            os: ubuntu-latest

          - python: "3.14"
            toxenv: py314
            os: macos-latest
          - python: "3.14"
            toxenv: py314
            os: windows-latest

    runs-on: ${{ matrix.os }}
    env:
      # Release checks use PyPI; other branches test both development dependencies.
      # tox reads this when resolving dependencies inside each test environment.
      TILINGS_TEST_DEPS: >-
        ${{ github.ref != 'refs/heads/master' &&
            !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'master') &&
            '-r.github/requirements-develop.txt' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tox.ini
            .github/requirements-develop.txt
      - name: Install tox
        run: python -m pip install --upgrade pip "tox>=4,<5"
      - name: Run checks
        run: python -m tox run -e ${{ matrix.toxenv }}
